name: Refresh live tracker

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes (GitHub may delay a run by several minutes)
  workflow_dispatch:            # lets you press "Run workflow" by hand

permissions:
  contents: write

concurrency:
  group: live-tracker
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live events
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: python src/fetch_live.py
      - name: Commit if changed
        run: |
          # fetch_live.py leaves the file alone when nothing changed
          if git diff --quiet -- dashboard/live.js; then echo "no change"; exit 0; fi
          git config user.name "aidgap-bot"
          git config user.email "aidgap-bot@users.noreply.github.com"
          git add dashboard/live.js
          git commit -m "Refresh live tracker data"
          git pull --rebase
          git push
